<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مراكز التبرع بالدم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- Font Awesome للأيقونات -->
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/search.css" />
</head>
<body>

  <nav class="main-nav">
    <div class="nav-container">
      <!-- اللوجو -->
      <div class="logo">
        <img src="Images/logo.png" alt="BloodLink Logo">
      </div>

      <!-- زرار الهامبرجر - يظهر في الموبايل فقط -->
      <button class="mobile-menu-btn" aria-label="فتح القائمة">
        <i class="fas fa-bars"></i>
      </button>

      <!-- قائمة الروابط -->
      <ul class="nav-links">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="login.html">تسجيل الدخول</a></li>
        <li><a href="BloodLink-Info.html">معلومات التبرع</a></li>
        <li><a href="blood-request.html">طلب دم</a></li>
        <li><a href="donate.html">تبرع الآن</a></li>
        <li><a href="search.html" class="active">مراكز التبرع</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Header -->
  <header class="hero">
    <div class="hero-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
      </svg>
    </div>
    <h1>مراكز التبرع بالدم</h1>
    <p class="hero-subtitle">ابحث عن أقرب مركز تبرع بالدم وساعد في إنقاذ الأرواح</p>
    <div class="divider">
      <div class="divider-line"></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#C8102E">
        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
      </svg>
      <div class="divider-line"></div>
    </div>
  </header>

  <!-- Sticky Filters -->
  <div class="filters-section">
    <div class="filters-inner">
      <select class="filter-select" id="filterBlood" onchange="applyFilters()">
        <option value="">🩸 الفصيلة</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>

      <select class="filter-select" id="filterRegion" onchange="applyFilters()">
        <option value="">📍 المنطقة</option>
        <option value="القاهرة">القاهرة</option>
        <option value="الجيزة">الجيزة</option>
        <option value="الإسكندرية">الإسكندرية</option>
      </select>

      <select class="filter-select" id="filterStatus" onchange="applyFilters()">
        <option value="">الحالة</option>
        <option value="متاح">متاح الآن</option>
        <option value="مغلق">مغلق</option>
      </select>

      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="ابحث عن مركز أو منطقة…" oninput="applyFilters()" />
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <span>تم العثور على <strong id="resultCount">0</strong> مركز تبرع</span>
  </div>

  <main class="grid-section">
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <!-- Start Social Footer -->
<div class="social-footer">
    <div class="container">
        <p>find us on social networks</p>
        <div class="icons">
            <a href="https://www.linkedin.com/in/moaz-wael-65a9ba378" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/Moaz2006" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://wa.me/201098558453" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>
</div>
<!-- End Social Footer -->

  <script src="js/main.js"></script>
</body>
</html>
