<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - طلب دم</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/blood-request.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Start Header -->
<header>
    <div class="container">
        <a href="index.html" class="logo"><img src="Images/logo.png" alt="Logo"></a>
        <nav>
            <i class="fas fa-bars toggle-menu"></i>
            <ul class="links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="BloodLink-Info.html">معلومات التبرع</a></li>
                <li><a href="blood-request.html" class="active">طلب دم</a></li>
                <li><a href="donate.html">تبرع الآن</a></li>
                <li><a href="search.html">مراكز التبرع</a></li>
            </ul>
        </nav>
    </div>
</header>
<!-- End Header -->

<!-- Start Request -->
<div class="request-page">
    <div class="container">
        <div class="request-card">
            <div class="card-header">
                <button type="submit" form="main-request-form" class="btn-submit">الرجوع</button>
                <h2>استمارة طلب بالدم</h2>
                <a href="index.html" class="btn-back">ارسال الاستمارة</a>
            </div>

            <form id="main-request-form" class="card-body">
                <!-- Personal Data -->
                <div class="form-side personal-data">
                    <div class="input-group">
                        <label class="text3">الاسم كامل</label>
                        <input type="text" placeholder="الاسم رباعي">
                    </div>
                    <div class="input-group">
                        <label class="text3">العمر</label>
                        <input type="number" placeholder="العمر" required>
                    </div>
                    <div class="input-group">
                        <label class="text3">نوع الجنس</label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="radio" name="gender" required> ذكر</label>
                            <label class="radio-label"><input type="radio" name="gender"> انثي</label>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="text3">العنوان بالتفصيل</label>
                        <input type="text" placeholder="المستشفى / المنطقة" required>
                    </div>
                    <div class="input-group">
                        <label class="text3">رقم الهاتف</label>
                        <div class="phone-input">
                            <input type="tel" placeholder="010xxxxxxx" required>
                            <i class="fas fa-phone"></i>
                        </div>
                    </div>
                </div>

                <!-- Blood Data -->
                <div class="form-side blood-data">
                    <div class="input-group">
                        <label class="text">نوع فصيلة الدم</label>
                        <div class="blood-grid">
                            <label class="blood-item"><input type="radio" name="type" required> O-</label>
                            <label class="blood-item"><input type="radio" name="type"> O+</label>
                            <label class="blood-item"><input type="radio" name="type"> A-</label>
                            <label class="blood-item"><input type="radio" name="type"> A+</label>
                            <label class="blood-item"><input type="radio" name="type"> B-</label>
                            <label class="blood-item"><input type="radio" name="type"> B+</label>
                            <label class="blood-item"><input type="radio" name="type"> AB-</label>
                            <label class="blood-item"><input type="radio" name="type"> AB+</label>
                        </div>
                    </div>
                    <div class="input-group qty-section">
                        <label class="text2">عدد الاكياس المطلوبة</label>
                        <div class="qty-control">
                            <button type="button" class="plus">+</button>
                            <input type="number" value="0" min="0">
                            <button type="button" class="minus">-</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- End Request -->

<!-- Start Social Footer -->
<div class="social-footer">
    <div class="container">
        <p>find us on social networks</p>
        <div class="icons">

</body>
</html>
