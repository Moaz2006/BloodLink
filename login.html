<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/blood-request.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- Start Header -->
<header>
    <div class="container">
        <a href="index.html" class="logo">
            <img src="Images/logo.png" alt="BloodLink">
        </a>
        <nav>
            <i class="fas fa-bars toggle-menu"></i>
            <ul class="links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="login.html" class="active">تسجيل الدخول</a></li>
                <li><a href="BloodLink-Info.html">معلومات التبرع</a></li>
                <li><a href="blood-request.html">طلب دم</a></li>
                <li><a href="donate.html">تبرع الآن</a></li>
                <li><a href="search.html">مراكز التبرع</a></li>
            </ul>
        </nav>
    </div>
</header>
<!-- End Header -->

<!-- Start Login -->
<div class="login-container">
    <div class="container">
        <div class="info-side">
            <img src="Images/logo2.png" alt="BloodLink Logo">
            <p>سجل دخولك لمتابعة طلبات التبرع والمساهمة في إنقاذ المزيد من الأرواح</p>
        </div>
        <div class="form-side2">
            <h2>تسجيل الدخول</h2>
            <form action="">
                <div class="input-group">
                    <label class="mail">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="البريد الإلكتروني">
                        <i class="far fa-envelope"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label class="pass">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="كلمة المرور">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <a href="#" class="forgot">هل نسيت كلمة السر؟</a>
                <button type="submit" class="btn-login">تسجيل الدخول <i class="fas fa-sign-in-alt"></i></button>
            </form>
        </div>
    </div>
</div>
<!-- End Login -->

<!-- Start Social Footer -->
<div class="social-footer">
    <div class="container">
        <p>find us on social networks</p>
        <div class="icons">
            <a href="https://www.linkedin.com/in/moaz-wael-65a9ba378" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/Moaz2006" target="_blank"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>
</div>
<!-- End Social Footer -->

<script src="js/main.js"></script>
</body>
</html>
